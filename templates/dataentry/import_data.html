{% extends 'base.html' %}
 {% block content %}
    

    <div class="container mt-5 alert-primary shadow" style="max-width: 600px;padding: 50px;border-radius: 10px;">
        <h3 class="text-center">Import data to database tables</h3>
        <form action="{% url 'import_data' %}" method="POST" enctype="multipart/form-data" required style="max-width: 600px; margin: auto; padding-top: 50px;">
            {% csrf_token %}
            <div class="form-group">
                <label for="file_path">Upload File</label>
                <input type="file" name="file_path" class="form-control">
                
            </div>


            <div class="form-group">
                <label for="file_path">Select Database Table</label>
                <select name="model_name" id="" class="form-control" required>
                    <option value="" disabled selected>Select</option>
                    {% for model in all_models %}
                        {% if model != "User" %}
                            <option value="{{model}}">{{model}}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

           <div class="form-group">
             <input type="submit" value="Import Data" class="btn btn-primary">
           </div>

            {% include 'alert.html' %}
        </form>
    </div>
{% endblock %}
