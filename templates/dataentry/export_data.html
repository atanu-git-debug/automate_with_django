{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- jQuery library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Latest compiled JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <title>Automate boring stuff with django</title>
    <script src="{% static 'js/cusyom.js' %}"></script>
</head>
<body>
    <div class="container">
        <h3 class="text-center">Export data from database tables</h3>
        <form action="{% url 'export_data' %}" method="POST"  required style="max-width: 600px; margin: auto; padding-top: 50px;">
            {% csrf_token %}
            


            <div class="form-group">
                <label for="file_path">Select Database Table</label>
                <select name="model_name" id="" class="form-control" required>
                    <option value="" disabled selected>Select</option>
                    {% for model in custom_models %}
                        {% if model != "User" %}
                            <option value="{{model}}">{{model}}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <input type="submit" value="Export Data" class="btn btn-primary">

            {% include 'alert.html' %}
        </form>
    </div>
</body>
</html>
