{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}
    
    <div class="container mt-5 mb-5 p-3 shadow rounded" style="max-width: 600px;" >
        <h2 class="text-center">Login</h2>
        <form action="" method="post">
            {% csrf_token %}
            <div class="form-group">

                {{form | crispy}}

                <small><a href="{% url 'register' %}">Don't have an account ? Register Here</a></small><br>


                <input type="submit" value="Login" class="btn btn-success mt-3">

            </div>
            {% include 'alert.html' %}
        </form>
    </div>
{% endblock %}
